<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM 2</title>
    <style>
        * {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        body {
            color: rgb(212, 99, 58);
            background-color: rgb(34, 34, 34);
        }

        h1 {
            text-align: center;
        }

    </style>

</head>
<body>
    <main>
        <h1>Trabalho com inputs do usuario</h1>
        <section>
            <article>
                <input type="number" name="txtn1" id="txtn1"> + 
                <input type="number" name="txtn2" id="txtn2">
                <input type="button" value="SOMAR" onclick="somar()"">
                <p id="res">Resultado</p>
                <script>
                    function somar() {
                        tn1 = document.getElementById('txtn1')
                        tn2 = document.querySelector('input#txtn2')
                        res = document.getElementById('res')
                        n1 = Number(tn1.value)
                        n2 = Number(tn2.value)
                        s = n1 + n2

                        res.innerHTML = `A soma entre ${n1} e ${n2} é ${s}.`
                    }

                </script>
            </article>
        </section>
    </main>

    
</body>
</html>
