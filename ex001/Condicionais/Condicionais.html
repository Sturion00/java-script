<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>
    <style>

        :root {
            --corTitulo: rgb(30, 150, 0);
            --corSubtitulo: rgb(114, 81, 116);
        }

        * {
            margin: 0;
            padding: 0;
            background-color: rgb(34, 34, 34);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #titulo {
            color: var(--corTitulo);
            text-align: center;
            margin: 10px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 2.5em;
        }
        #subtitulo {
            color: var(--corSubtitulo);
            margin: -10px 0 20px 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align: center;
            font-style: italic;
        }

        div#codeblock {
            font-family: 'Courier New', Courier, monospace;
            border-radius: 15px;
            font-weight: bolder;
            background-color: rgb(26, 24, 22);
            color: rgb(115, 116, 128);
            padding: 20px;
            margin: 20px;
            max-width: 500px;
            margin: auto;
        }

    </style>
</head>
<body>
    <main>
        <h1 id="titulo">Sobre condicionais</h1>
        <section>
            <article>

            </article>

    </main>

</html>
