<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            color: rgb(179, 179, 179);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        
        body {
            background-color: rgb(40, 43, 51);
        }

        h1 {
            color: rgb(223, 223, 223);            
            text-align: center;
            margin: 20px;
            font-size: 2.2em;
        }

        section#conteudo {
            border-radius: 10px;
            background-color: rgb(50, 54, 65);
            padding: 10px;
            margin: 10px;
        }
        
        h2 {
            color: rgb(223, 223, 223);
            padding-bottom: 10px;
        }

        h3 {
            color: rgb(223, 223, 223);
           padding: 30px 0 10px 0;
        }

    </style>
</head>
<body>
    <h1>Teste com mais operadores</h1>
    <section class="apresentacao" id="conteudo">
        <h2>Operadores Relacionais</h3>
        <p>Todo resultado destes operadors retorna valores booleanos <strong>(TRUE; FALSE)</strong></p>
        <span>
            <script>
                document.write(`É maior? 5 > 2 = ${5>2} <br>`)
                document.write(`É menor? 7 > 4 = ${7<4} <br>`)
                document.write(`É maior ou igual? 8 >= 8 = ${8>=8} <br>`)
                document.write(`É menor ou igual? 9 <= 7 = ${9==7} <br>`)
                document.write(`É igual? 5 == 5 = ${5==5} <br>`)
                document.write(`É diferente? 4 != 4 = ${4!=4} <br>`)
            </script>
        </span>
        <h3>Tambem com variáveis</h3>
        <p>
            Declaração de variáveis: <br>
            var a = 10 <br>
            var a = 15
        </p>
        <span>
            <script>
                a = 10
                b = 15
                document.write(`a > b = ${a>b} <br>`)
                document.write(`a < b = ${a<b} <br>`)
                document.write(`a / b >= 1 = ${a/b >= 1} <br>`)
                document.write(`a == b = ${a==b} <br>`)
                document.write(`a + b = 20? = ${a+b==20} <br>`)
                document.write(`(a - b) * (a + b) = -125? = ${(a+b)*(a-b) == -125} <br>`)
            </script>
        </span>
    </section>
    <section class="identidade" id="conteudo">
        <h2>Operadores de Identidade</h2>
        <p>Estes comparam o tipo e natureza dos dados. Ex: strings</p>
        <span>
            <p>
                Variavies: <br>
                x = 5 <br>
                y = 5 <br>
            </p>
            <script>
            x = 5
            y = '5'
            document.write(`Qual o tipo de x? - ${typeof x} <br>`)
                document.write(`Qual o tipo de y? - ${typeof y} <br>`)
                document.write(`É igual? - x == y? - ${x == y} <br>`)
                document.write(`É identico? x === y - ${x === y} <br><br>`)
                document.write(`É dirente? x != y - ${x != y} <br>`)
                document.write(`É desigual restrito? x !== y - ${x !== y} <br>`)
                </script>
        </span>
    </section>
</body>
</html>
