<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(63, 136, 219);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        header {
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
        }

        h3 {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-style: italic;
            text-align: center;
            color: white
        }

        section {
            background-color: rgb(238, 252, 253);
            width: 600px;
            height: auto;
            margin: auto;
            padding: 2%;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-direction: column;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.308);
        }
        
        article {
            font-size: 1.5em;
            font-weight: 500;
        }
        
        article#texto {
            text-align: center;
        }

        article#saida {
            margin-top: 20px;
        }
        
        img {
            width: 350x;
            height: 350px;
            border-radius: 50%;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.486);
        }

        footer {
            margin-top: 15px;
            text-align: center;
            color: white;
        }
        
        </style>
</head>
<body onload="carregar()">
    <main>
        <header>
            <h1>Exercicio_2</h1>
            <h3>Verificador de Idade</h3>
        </header>
        <section>
            <article id="entrada">
                <p>
                    Ano de Nascimento:<br>
                    <input style="width: 230px;" type="number" name="txtano" id="txtano" placeholder="1920-2026" min="1920" max="2026">
                </p>
                <p>
                    Sexo: <br>
                    <input type="radio" name="radsex" id="mas" checked>
                    <label for="masc">Masculino</label>
                    <input type="radio" name="radsex" id="fem">
                    <label for="fem">Feminino</label>
                </p>
                <p>
                    <input type="button" value="Verificar" onclick="verificar()">
                </p>
            </article>
            <article id="saida">
                <p>
                    
                </p>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo.</p> 
    </footer>
    <script src="script.js"></script>
</body>
</html>
