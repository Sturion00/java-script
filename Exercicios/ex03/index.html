<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgba(7, 0, 0, 0.90);
            color: rgb(202, 211, 211);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px;
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        section {
            background-color: rgb(83, 51, 38);
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.281);
            width: 500px;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
        }

        article#input {
            
        }

        article#input>p  {
            margin: 10px;
        }

        article#output>p {
            margin: 10px;
        }

        input {
            text-align: center;
            width: 100px;
            padding: 2px;
            border-radius: 7px;
            background-color: rgb(94, 59, 43);
            color: rgb(202, 211, 211);
        }
        input#press {
            background-color: rgb(71, 45, 33);
            border-radius: 4px;
        }

        article#output {
            margin-top: 10px;
        }


        footer {
            text-align: center;
            color: rgb(128, 76, 52);
        }

    </style>
</head>
<body>
    <h1>Contador com Condicionais</h1>
    <main>
        <Section>
            <article id="input">
                <h3>Defina os dados:</h3>
                <p>Inicio: <input type="number" name="txti" id="txti"></p>
                <p>Fim: <input type="number" name="txtf" id="txtf"></p>
                <p>Razão:  <input type="number" name="txtr" id="txtr"></p>
                <p><input style="margin-top: 10px;" type="button" value="CALCULAR" id="press" onclick="calcular()"></p>
            </article>
            <h3>Resultado:</h3>
            <article id="output">
                <p><i>_esprando valores_</i></p>
            </article>
        </Section>
    </main>
    <footer>
        <p>&copy Curso em Vídeo 2026.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
