<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(146, 139, 126);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        header {
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: rgb(48, 46, 43);
        }

        h3 {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-style: italic;
            text-align: center;
            color: rgb(85, 81, 74);
        }

        section {
            background-color: rgb(167, 159, 146);
            width: 700px;
            height: 500px;
            margin: auto;
            padding: 2%;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-direction: column;
        }

        article {
            font-weight: bolder;
        }

        img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
        }

        footer {
            margin-top: 15px;
            text-align: center;
        }
        
        </style>
</head>
<body>
    <main>
        <header>
            <h1>Exercicio_1</h1>
            <h3>Interativiade com a hora local</h3>
        </header>
        <section>
            <article>
                <p>
                    Falta 15 pra daqui a pouco
                </p>
            </article>
            <article id="img">
                <img src="" alt="">
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo.</p> 
    </footer>
    <script src="scrip.js"></script>
</body>
</html>
