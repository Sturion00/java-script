<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        * {
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        body {
            color: rgb(239, 247, 255);
            background-color: rgb(39, 39, 39);
        }

    </style>
</head>
<body>
    <h1>Exercicio 3</h1>
    <div>
        <h2>Dias Vividos</h2>
        <p>Ano de nascimento: <input type="number" name="txta" id="txta"></p>
        <input type="button" value="CALCULAR" onclick="calcular()">
    </div>
    <div id="saida">
        <p></p>
    </div>
    <script>
        function calcular() {
           let ano = document.getElementById('txta').value
           let atAno = new Date().getFullYear()
           const dAno = Number(365)
           let res = (atAno - ano) * dAno
           let saida = document.querySelector('div#saida>p')
           
            if (ano == 0) {
                alert('Informe o Ano de Nascimento')
            } else {
                saida.innerHTML = ` Você ja viveu ${res} dias.`
            }

        }
    </script>
</body>
</html>
