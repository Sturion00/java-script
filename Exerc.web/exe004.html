<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        * {
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        body {
            color: rgb(239, 247, 255);
            background-color: rgb(39, 39, 39);
        }

    </style>
</head>
<body>
    <h1>Exercicio 3</h1>
    <div>
        <h2>Dias Vividos</h2>
        <p>Ano de nascimento: <input type="date" name="txta" id="txta"></p>
        <input type="button" value="CALCULAR" onclick="calcular()">
    </div>
    <div id="saida">
        <p></p>
    </div>
    <script>
        function calcular() {
            const data = new Date(document.getElementById('txta').value).getTime()
            const agora = new Date().getTime()
            let saida = document.querySelector('div#saida>p')
            const tRes = agora - data
            
            const ano = Math.floor(tRes / 1000 / 60 / 60 / 24 / 365)
            const mes = (tRes - ano) / 1000 / 60 / 60 / 24
            const dia = ''


            alert(ano)

            saida.innerHTML += `Já se passaram ${ano} anos, ${mes} meses e ${dia} dias.`
            
        }
    </script>
</body>
</html>
