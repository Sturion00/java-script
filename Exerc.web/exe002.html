<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <style>
        * {
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        body {
            color: rgb(239, 247, 255);
            background-color: rgb(39, 39, 39);
        }

    </style>
</head>
<body>
    <h1>Exercicio 2</h1>
    <div>
        <h2>Divisor</h2>
        <p>Dividendo: <input type="number" name="txt1" id="txt1"></p>
        <p>Divisor: <input type="number" name="txt2" id="txt2"></p>
        <p><input type="button" value="CALCULAR" onclick="calcular()"></p>
    </div>
    <div id="saida">
        --Informe os Valores--
    </div>
    <script>
        function calcular() {
            let num1 = Number(document.getElementById('txt1').value)
            let num2 = Number(document.getElementById('txt2').value)
            let saida = document.querySelector('div#saida')
            let res = num1 / num2

            if (num1 == 0 || num2 == 0) {
                alert('Digite os dois Números...')
            } else {
                saida.innerHTML = `O valor é ${res}`
            }
        }
    </script>
</body>
</html>
