<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadore de J.Script</title>
</head>
<body>
    <script>
        var a = 5
        var b = 2

        document.write(`${a + b} <br>`) // 7
        document.write(`${a - b} <br>`) // 3
        document.write(`${a / b} <br>`) // 2.5
        document.write(`${a % b} <br>`) // 1
        document.write(`${a * b} <br>`) // 10
        document.write(`${a ** b} <br>`) // 25

        /*Ordem de precedendia dos operardores aritimeticos em Js

        1. ()
        2. **
        3. * / %
        4. + -

        */
        </script>
</body>
</html>
